name: Collect CF optimized IPs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    concurrency:
      group: cfyouxuanip-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect nodes
        run: python scripts/collect_cf_ips.py
      - name: Verify aggregate output
        run: test -f ip.aggregate.txt
      - name: Commit aggregate
        run: |
          if git diff --quiet -- ip.aggregate.txt; then
            echo "ip.aggregate.txt unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ip.aggregate.txt
          git commit -m "Update upstream IP aggregate"
          git push
