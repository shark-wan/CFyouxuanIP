name: Apply local SG ranking

on:
  push:
    paths:
      - "sg-ranking.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfyouxuanip-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply local SG ranking
        run: python scripts/apply_sg_ranking.py
      - name: Commit ip.txt
        run: |
          if git diff --quiet -- ip.txt; then
            echo "ip.txt unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ip.txt
          git commit -m "Apply local SG ranking"
          git push
